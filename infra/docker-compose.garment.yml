# The Ethnic Threads demo stack (ADR 0027): TMS as the support desk of the
# garment-web-scraper app, which runs on this machine outside Docker.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.garment.yml --profile app up -d --build
#
# (scripts/demo/garment-demo.ps1 wraps this.) It is its own compose project
# with its own volumes and its own ports, so it runs next to the default
# stack without touching that stack's database:
#
#   Orbit Desk  http://localhost:8091      API     http://localhost:3200
#   Help center http://localhost:8090/help Widget  http://localhost:8090/widget/tms-chat.js
#   Mail sink   http://localhost:8125
name: tms-garment

# What differs from the default stack, for the API and the worker. The first
# line lets the storefront (Vite, :5173) call the API: shoppers chat from there.
x-garment-env: &garment-env
  CORS_ORIGINS: http://localhost:8090,http://localhost:8091,http://localhost:5173
  # Where this stack serves the help center and the chat widget: links in emails and the
  # widget snippet in Settings point here.
  HELP_CENTER_URL: http://localhost:8090/help/
  # The AI's tools and the webhooks call the app's worker on the host machine.
  TOOL_PRIVATE_HOSTS: fake-providers,host.docker.internal
  WEBHOOK_PRIVATE_HOSTS: host.docker.internal
  # Short waits, so a breach and a retry can be watched happening.
  SLA_SWEEP_SECONDS: '10'
  WEBHOOK_BACKOFF_MS: '3000'

services:
  postgres:
    ports: !override
      - '5442:5432'

  redis:
    ports: !override
      - '6389:6379'

  objectstore:
    ports: !override
      - '9100:8333'
      - '8988:8888'

  mailpit:
    ports: !override
      - '1125:1025'
      - '8125:8025'

  greenmail:
    ports: !override
      - '3125:3025'
      - '3243:3143'

  litellm:
    ports: !override
      - '4100:4000'

  fake-providers:
    ports: !override
      - '4110:4010'

  migrate:
    environment:
      # No demo teams, categories or customers: the garment loader sets up Ethnic Threads.
      SEED_DEMO_DATA: 'false'

  api:
    environment: *garment-env
    ports: !override
      - '3200:3000'

  worker:
    environment: *garment-env

  web:
    ports: !override
      - '8090:80'

  orbit-desk:
    ports: !override
      - '8091:80'
