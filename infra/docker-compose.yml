name: tms

# Environment shared by the api, worker and migrate containers.
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://tms:tms@postgres:5432/tms
  REDIS_URL: redis://redis:6379
  LITELLM_URL: http://litellm:4000
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tms-dev-master-key}
  # Encrypts stored channel/tool secrets (ADR 0009). Dev default only; generate with
  # `openssl rand -base64 32` for anything shared.
  TMS_SECRETS_KEY: ${TMS_SECRETS_KEY:-ZGV2LW9ubHktdG1zLXNlY3JldHMta2V5LTMyYnl0ZXM=}
  # Dev default only. Set JWT_SECRET in the environment for anything shared.
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
  # Dev default only: what a site signs a signed-in chat visitor's identity with. The sample
  # data's two chats that use tools are signed with it. Set your own for anything shared.
  CHAT_IDENTITY_SECRET: ${CHAT_IDENTITY_SECRET:-dev-only-chat-identity-secret-change-me-0123456789}
  # Add the address of your own app's pages here when they call the API or show the chat.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
  # MCP servers may live on these compose hosts (the sample Demo Store server in fake-providers).
  TOOL_PRIVATE_HOSTS: ${TOOL_PRIVATE_HOSTS:-fake-providers}
  # Webhook receivers may run on the machine that runs Docker (a local app, the E2E tests).
  # Everything else must be a public https address.
  WEBHOOK_PRIVATE_HOSTS: ${WEBHOOK_PRIVATE_HOSTS:-host.docker.internal}
  # Knowledge sources may be the stack's own object store; folder sources need KB_CONNECTOR_PATHS.
  KB_CONNECTOR_PRIVATE_HOSTS: ${KB_CONNECTOR_PRIVATE_HOSTS:-objectstore}
  KB_CONNECTOR_PATHS: ${KB_CONNECTOR_PATHS:-}
  API_DOCS: ${API_DOCS:-true}
  # Object storage (SeaweedFS S3 API)
  S3_ENDPOINT: http://objectstore:8333
  S3_ACCESS_KEY: tms
  S3_SECRET_KEY: tms-dev-secret
  S3_BUCKET: tms
  # Email channel: reads the dev mailbox in GreenMail, sends replies through Mailpit.
  EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
  EMAIL_ADDRESS: ${EMAIL_ADDRESS:-support@tms.local}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TMS Support}
  EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-greenmail}
  EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-3143}
  EMAIL_IMAP_SECURE: ${EMAIL_IMAP_SECURE:-false}
  EMAIL_IMAP_USER: ${EMAIL_IMAP_USER:-support@tms.local}
  EMAIL_IMAP_PASSWORD: ${EMAIL_IMAP_PASSWORD:-support}
  EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-30}
  # Tracing is off unless this is set, e.g. http://otel-collector:4318 with --profile observability.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
  EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
      POSTGRES_DB: tms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tms -d tms']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for attachments and KB documents.
  # (MinIO no longer publishes free images, so we use SeaweedFS.)
  # S3 API on :9000 with the credentials in seaweedfs/s3.json; filer UI on :8888.
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '9000:8333'
      - '8888:8888'
    volumes:
      - objectdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Outgoing mail sink: TMS replies land here. Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '1025:1025'
      - '8025:8025'

  # Dev support mailbox. Send customer mail to support@tms.local over SMTP
  # :3025 (pnpm demo:email does this); TMS reads it over IMAP :3143. Any
  # login works, so tests can also read other mailboxes.
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.verbose=false
    ports:
      - '3025:3025'
      - '3143:3143'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/3143']
      interval: 5s
      timeout: 3s
      retries: 30

  # All LLM traffic goes through LiteLLM. Providers and models are added at
  # runtime from the TMS settings pages and stored (encrypted) in its own DB.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      DATABASE_URL: postgres://tms:tms@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tms-dev-master-key}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-tms-dev-salt-key}
      STORE_MODEL_IN_DB: 'True'
    ports:
      - '4000:4000'
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    # First start runs LiteLLM's own migrations, which takes a minute or two.
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  # Scripted stand-ins for external providers (an OpenAI-compatible LLM for
  # now), so the demo and the tests work with no real API keys. LiteLLM
  # reaches it at http://fake-providers:4010/v1.
  fake-providers:
    profiles: ['app', 'fake']
    build: { context: .., dockerfile: Dockerfile, target: fake-providers }
    ports:
      - '4010:4010'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- TMS application (profile "app": `pnpm docker:up`) ----

  # One-shot: applies migrations and the idempotent seed, then exits.
  migrate:
    profiles: ['app']
    build: &build
      context: ..
      dockerfile: Dockerfile
      target: migrate
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build: { <<: *build, target: api }
    environment: *app-env
    # Docker Desktop provides this name; on Linux it has to be mapped.
    extra_hosts: &host-gateway
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build: { <<: *build, target: worker }
    environment: *app-env
    extra_hosts: *host-gateway
    restart: unless-stopped
    depends_on:
      <<: *app-deps
      greenmail:
        condition: service_healthy

  web:
    profiles: ['app']
    build: { <<: *build, target: web }
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Orbit Desk: the styled dashboard, same API behind it.
  orbit-desk:
    profiles: ['app']
    build: { <<: *build, target: orbit-desk }
    ports:
      - '8081:80'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'

volumes:
  pgdata:
  redisdata:
  objectdata:
