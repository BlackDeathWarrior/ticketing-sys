name: tms

# Environment shared by the api, worker and migrate containers.
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://tms:tms@postgres:5432/tms
  REDIS_URL: redis://redis:6379
  LITELLM_URL: http://litellm:4000
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tms-dev-master-key}
  # Dev default only. Set JWT_SECRET in the environment for anything shared.
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
  CORS_ORIGINS: http://localhost:8080
  API_DOCS: ${API_DOCS:-true}
  # Object storage (SeaweedFS S3 API)
  S3_ENDPOINT: http://objectstore:8333
  S3_ACCESS_KEY: tms
  S3_SECRET_KEY: tms-dev-secret
  S3_BUCKET: tms
  # Email channel: reads the dev mailbox in GreenMail, sends replies through Mailpit.
  EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
  EMAIL_ADDRESS: ${EMAIL_ADDRESS:-support@tms.local}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-TMS Support}
  EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-greenmail}
  EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-3143}
  EMAIL_IMAP_SECURE: ${EMAIL_IMAP_SECURE:-false}
  EMAIL_IMAP_USER: ${EMAIL_IMAP_USER:-support@tms.local}
  EMAIL_IMAP_PASSWORD: ${EMAIL_IMAP_PASSWORD:-support}
  EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-30}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
  EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
      POSTGRES_DB: tms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tms -d tms']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for attachments and KB documents.
  # (MinIO no longer publishes free images, so we use SeaweedFS.)
  # S3 API on :9000 with the credentials in seaweedfs/s3.json; filer UI on :8888.
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '9000:8333'
      - '8888:8888'
    volumes:
      - objectdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Outgoing mail sink: TMS replies land here. Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '1025:1025'
      - '8025:8025'

  # Dev support mailbox. Send customer mail to support@tms.local over SMTP
  # :3025 (pnpm demo:email does this); TMS reads it over IMAP :3143. Any
  # login works, so tests can also read other mailboxes.
  greenmail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.verbose=false
    ports:
      - '3025:3025'
      - '3143:3143'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/3143']
      interval: 5s
      timeout: 3s
      retries: 30

  # All LLM traffic goes through LiteLLM. Providers and models are added at
  # runtime from the TMS settings pages and stored (encrypted) in its own DB.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      DATABASE_URL: postgres://tms:tms@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-tms-dev-master-key}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-tms-dev-salt-key}
      STORE_MODEL_IN_DB: 'True'
    ports:
      - '4000:4000'
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---- TMS application (profile "app": `pnpm docker:up`) ----

  # One-shot: applies migrations and the idempotent seed, then exits.
  migrate:
    profiles: ['app']
    build: &build
      context: ..
      dockerfile: Dockerfile
      target: migrate
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build: { <<: *build, target: api }
    environment: *app-env
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build: { <<: *build, target: worker }
    environment: *app-env
    restart: unless-stopped
    depends_on:
      <<: *app-deps
      greenmail:
        condition: service_healthy

  web:
    profiles: ['app']
    build: { <<: *build, target: web }
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    profiles: ['observability']
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'

volumes:
  pgdata:
  redisdata:
  objectdata:
