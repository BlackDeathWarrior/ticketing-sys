name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TEST_DATABASE_URL: postgres://tms:tms@localhost:5432/tms_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Integration tests use the same services as local development, including
      # LiteLLM and the scripted fake LLM it routes to.
      - name: Start test services
        run: |
          docker compose -f infra/docker-compose.yml --profile fake up -d --build --wait postgres redis objectstore greenmail litellm fake-providers
          docker compose -f infra/docker-compose.yml exec -T postgres createdb -U tms tms_test
      - run: pnpm test:int
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200

  # Builds the Docker stack, loads the sample data and runs the Playwright suite.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml --profile app up -d --build --wait api worker web orbit-desk mailpit objectstore litellm fake-providers
      - run: pnpm sample:load
      - run: pnpm --filter @tms/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile app logs --tail 200
