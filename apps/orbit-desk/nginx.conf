# Serves the built Orbit Desk dashboard and forwards API calls to the api container, so
# the app's relative /api/v1 URLs work without CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every few seconds: a recreated api container gets a
    # new address, and a fixed upstream would answer 502 until nginx restarts.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Realtime: agent console and chat widget sockets.
    location /socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app uses hash routes (#/, #/elements); unknown paths fall back to it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
